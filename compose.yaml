services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: writewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-writewise-local-password}
      POSTGRES_DB: writewise
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writewise -d writewise"]
      interval: 5s
      timeout: 5s
      retries: 15
  application:
    profiles: ["application"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://writewise:${POSTGRES_PASSWORD:-writewise-local-password}@database:5432/writewise
      STORAGE_PATH: /app/storage
      ALLOW_DEMO_LOGIN: "false"
    ports:
      - "3000:3000"
    volumes:
      - upload-data:/app/storage
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
  upload-data:
